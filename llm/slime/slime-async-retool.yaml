# Slime Async ReTool: Fully Asynchronous RL Training with Tool Use
#
# This example combines:
# - Fully async training (persistent background worker for faster throughput)
# - ReTool framework (tool-augmented generation with code execution)
#
# The async pattern enables training and rollout to happen in parallel,
# significantly improving GPU utilization and training speed.
#
# Usage:
#   sky launch -c slime-async llm/slime/slime-async-retool.yaml --env WANDB_KEY=<your-key>

name: slime-async-retool

resources:
  accelerators: {A100-80GB:4, A100:4, H100:4}
  disk_size: 512
  use_spot: false
  ports:
    - 8265  # Ray dashboard

envs:
  HF_HUB_ENABLE_HF_TRANSFER: "1"
  WANDB_KEY: null  # Optional: Pass with --env WANDB_KEY=<key>

setup: |
  if [ -d /run/systemd/system ]; then sudo systemctl start docker || true; fi
  sudo nvidia-ctk runtime configure --runtime=docker || true
  sudo systemctl restart docker || true
  sudo usermod -aG docker $USER || true
  sudo docker pull slimerl/slime:latest

run: |
  sudo docker run --rm --gpus all --ipc=host --shm-size=16g \
    --ulimit memlock=-1 --ulimit stack=67108864 \
    -v ~/sky_workdir:/workspace \
    -e WANDB_KEY=${WANDB_KEY} \
    -p 8265:8265 \
    slimerl/slime:latest bash -c '
  
  set -ex
  
  # Clone Slime repository
  cd /root
  git clone https://github.com/THUDM/slime.git
  cd slime
  pip install -e .
  
  echo "================================================"
  echo "Step 1: Downloading datasets and models (parallel)..."
  echo "================================================"
  
  # Download all three in parallel for faster setup
  hf download --repo-type dataset zhuzilin/dapo-math-17k --local-dir /root/dapo-math-17k &
  hf download --repo-type dataset zhuzilin/aime-2024 --local-dir /root/aime-2024 &
  hf download font-info/qwen3-4b-sft-SGLang-RL --local-dir /root/font-info/qwen3-4b-sft &
  
  # Wait for all downloads to complete
  wait
  echo "All downloads completed!"
  
  echo "================================================"
  echo "Step 2: Converting model to Megatron format..."
  echo "================================================"
  
  # Source model configuration
  source scripts/models/qwen3-4B.sh
  
  # Convert HuggingFace checkpoint to Megatron torch_dist format
  PYTHONPATH=/root/Megatron-LM python tools/convert_hf_to_torch_dist.py \
      ${MODEL_ARGS[@]} \
      --hf-checkpoint /root/font-info/qwen3-4b-sft \
      --rotary-base 5000000 \
      --save /root/font-info/qwen3-4b-sft_torch_dist
  
  echo "================================================"
  echo "Step 3: Starting Async RL training with ReTool..."
  echo "================================================"
  
  # Clean up any previous runs
  pkill -9 sglang || true
  sleep 3
  ray stop --force || true
  pkill -9 ray || true
  pkill -9 python || true
  sleep 3
  
  export PYTHONBUFFERED=16
  
  # Detect NVLink for optimal communication
  NVLINK_COUNT=$(nvidia-smi topo -m 2>/dev/null | grep -o "NV[0-9][0-9]*" | wc -l)
  if [ "$NVLINK_COUNT" -gt 0 ]; then
      HAS_NVLINK=1
  else
      HAS_NVLINK=0
  fi
  echo "HAS_NVLINK: $HAS_NVLINK (detected $NVLINK_COUNT NVLink references)"
  
  SCRIPT_DIR="/root/slime/examples/retool"
  
  # Model specification and checkpoint arguments for Qwen3-4B
  source scripts/models/qwen3-4B.sh
  CKPT_ARGS=(
     --hf-checkpoint /root/font-info/qwen3-4b-sft
     --ref-load /root/font-info/qwen3-4b-sft_torch_dist
     --save /root/font-info/qwen3-4b-sft/async-retool-ckpts/
     --save-interval 20
     --rotary-base 5000000
  )
  
  # Rollout arguments - using custom tool-enabled generation
  ROLLOUT_ARGS=(
     --prompt-data /root/dapo-math-17k/dapo-math-17k.jsonl
     --input-key prompt
     --label-key label
     --apply-chat-template
     --rollout-shuffle
     --reward-key score
     --num-rollout 3000
     --rollout-batch-size 32
     --n-samples-per-prompt 8
     --rollout-max-response-len 8192
     --rollout-temperature 0.8
     --global-batch-size 256
     --balance-data
  )
  
  # Evaluation arguments
  EVAL_ARGS=(
     --eval-interval 20
     --eval-prompt-data aime /root/aime-2024/aime-2024.jsonl
     --n-samples-per-eval-prompt 16
     --eval-max-response-len 16384
     --eval-top-p 0.7
  )
  
  # Performance arguments
  PERF_ARGS=(
     --tensor-model-parallel-size 2
     --sequence-parallel
     --pipeline-model-parallel-size 1
     --context-parallel-size 1
     --expert-model-parallel-size 1
     --expert-tensor-parallel-size 1
     --recompute-granularity full
     --recompute-method uniform
     --recompute-num-layers 1
     --use-dynamic-batch-size
     --max-tokens-per-gpu 9216
  )
  
  # GRPO algorithm arguments
  GRPO_ARGS=(
     --advantage-estimator grpo
     --use-kl-loss
     --kl-loss-coef 0.00
     --kl-loss-type low_var_kl
     --entropy-coef 0.00
     --eps-clip 0.2
     --eps-clip-high 0.28
  )
  
  # Optimizer arguments
  OPTIMIZER_ARGS=(
     --optimizer adam
     --lr 1e-6
     --lr-decay-style constant
     --weight-decay 0.1
     --adam-beta1 0.9
     --adam-beta2 0.98
  )
  
  # W&B logging (optional)
  WANDB_ARGS=()
  if [ ! -z "${WANDB_KEY}" ]; then
    WANDB_ARGS=(
       --use-wandb
       --wandb-project slime-async-retool
       --wandb-group qwen3-4B-async-retool
       --wandb-key ${WANDB_KEY}
    )
  fi
  
  # SGLang arguments
  SGLANG_ARGS=(
     --rollout-num-gpus-per-engine 2
     --sglang-mem-fraction-static 0.7
  )
  
  # Miscellaneous arguments
  MISC_ARGS=(
     --attention-dropout 0.0
     --hidden-dropout 0.0
     --accumulate-allreduce-grads-in-fp32
     --attention-softmax-in-fp32
     --attention-backend flash
  )
  
  # Custom tool-enabled generation and reward functions
  CUSTOM_ARGS=(
     --custom-generate-function-path generate_with_retool.generate
     --custom-rm-path generate_with_retool.reward_func
  )
  
  # Start Ray head node
  export MASTER_ADDR=${MASTER_ADDR:-"127.0.0.1"}
  ray start --head --node-ip-address ${MASTER_ADDR} \
    --num-gpus 4 --disable-usage-stats \
    --dashboard-host=0.0.0.0 --dashboard-port=8265
  
  # Wait for Ray GCS to be ready before submitting jobs
  while ray status 2>/dev/null | grep -q "No cluster status."; do
    echo "Waiting ray cluster to be initialized"
    sleep 1
  done
  
  # Build runtime environment with proper paths
  RUNTIME_ENV_JSON="{
    \"env_vars\": {
      \"PYTHONPATH\": \"/root/Megatron-LM/:${SCRIPT_DIR}:/root/slime\",
      \"CUDA_DEVICE_MAX_CONNECTIONS\": \"1\",
      \"NCCL_NVLS_ENABLE\": \"${HAS_NVLINK}\"
    }
  }"
  
  # Submit async training job to Ray
  ray job submit --address=\"http://127.0.0.1:8265\" \
     --runtime-env-json=\"${RUNTIME_ENV_JSON}\" \
     -- python3 train_async.py \
     --actor-num-nodes 1 \
     --actor-num-gpus-per-node 4 \
     --rollout-num-gpus 4 \
     ${MODEL_ARGS[@]} \
     ${CKPT_ARGS[@]} \
     ${ROLLOUT_ARGS[@]} \
     ${OPTIMIZER_ARGS[@]} \
     ${GRPO_ARGS[@]} \
     ${DISTRIBUTED_ARGS[@]} \
     ${WANDB_ARGS[@]} \
     ${PERF_ARGS[@]} \
     ${EVAL_ARGS[@]} \
     ${SGLANG_ARGS[@]} \
     ${MISC_ARGS[@]} \
     ${CUSTOM_ARGS[@]}
  '
