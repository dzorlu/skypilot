# Usage:

name: slime-glm4-9b-modal

resources:
  accelerators: H100:8

file_mounts:
  /workspace/checkpoints:
    name: slime-glm4-checkpoints-modal
    persistent: true
  /workspace/debug_rollouts:
    name: slime-rollouts-modal
    persistent: true

envs:
  HF_HUB_ENABLE_HF_TRANSFER: "1"
  PYTHONPATH: /root/Megatron-LM/
  CUDA_DEVICE_MAX_CONNECTIONS: "1"

setup: |
  set -ex

  cd /root
  if [ ! -d "slime" ]; then
    git clone https://github.com/THUDM/slime.git
  else
    cd slime && git pull && cd ..
  fi
  cd slime
  pip install -e .

  if [ ! -d "/root/Megatron-LM" ]; then
    git clone https://github.com/NVIDIA/Megatron-LM.git /root/Megatron-LM
  fi

run: |
  set -ex

  # Map Modal secrets to the env names the training uses.
  export HF_TOKEN="${HF_TOKEN:-${HUGGING_FACE_HUB_TOKEN:-}}"
  export WANDB_KEY="${WANDB_KEY:-${WANDB_API_KEY:-}}"

  echo "================================================"
  echo "Step 1: Downloading datasets and model (parallel)..."
  echo "================================================"
  hf download --repo-type dataset zhuzilin/dapo-math-17k --local-dir /root/dapo-math-17k &
  hf download --repo-type dataset zhuzilin/aime-2024 --local-dir /root/aime-2024 &
  hf download THUDM/glm-4-9b-chat --local-dir /root/GLM-Z1-9B-0414 &
  wait

  echo "================================================"
  echo "Step 2: Converting model to Megatron format..."
  echo "================================================"
  cd /root/slime
  source scripts/models/glm4-9B.sh
  PYTHONPATH=/root/Megatron-LM python tools/convert_hf_to_torch_dist.py \
      ${MODEL_ARGS[@]} \
      --hf-checkpoint /root/GLM-Z1-9B-0414 \
      --save /root/GLM-Z1-9B-0414_torch_dist

  echo "================================================"
  echo "Step 3: Starting RL training..."
  echo "================================================"
  bash scripts/run-glm4-9B.sh